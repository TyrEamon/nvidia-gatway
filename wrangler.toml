name = "nvidia-gatway"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
# 必须先在 Cloudflare 创建 KV namespace，然后把下面这个 id 替换成自己的 KV namespace ID。
# 不要直接部署占位符；不填真实 KV，后台配置和 API Key 都无法保存。
[[kv_namespaces]]
binding = "KV"
id = "59e9b813637545d7abef22c029961bf0"  #替换为你复制的kv id
# 管理后台账号密码建议在 Cloudflare Dashboard > Variables and Secrets 里设置：
# ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD = "your-secure-password"
#
# 可选竞速参数也建议在 Dashboard 变量里设置：
# UPSTREAM_RACE_MAX_KEYS = "6"
# UPSTREAM_RACE_PER_KEY_RETRIES = "2"
# UPSTREAM_RACE_ATTEMPT_TIMEOUT_MS = "6000"
# UPSTREAM_RACE_OVERALL_TIMEOUT_MS = "30000"
